<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jessica Lorae">
<meta name="theme-color" content="#F8663C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Jessica Lorae</title>
<style>

:root, :root[data-theme="light"], :root[data-theme="dark"]{
  --card:#FFFFFF; --ink:#2B4F48; --muted:#4F6A5F; --faint:#86A69B;
  --line:#F1E7D6; --sand:#FBEFD5;
  --accent:#FF6A45; --accent-ink:#fff; --coral-ink:#C43D1E;
  --sea:#12B9A6; --sea-ink:#fff;
  --sea-deep:#0A7C6E;
  --sun:#FFC531;
  --alert:#F04A28; --alert-bg:#FFEAE2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FEF3E6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 44px;min-height:100vh;
  color:var(--ink);
  background:linear-gradient(168deg,#FFF4E2 0%,#FFECEC 42%,#E7FAF3 100%);
  background-attachment:fixed;}
.head{position:sticky;top:0;z-index:5;margin:-18px -14px 8px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 9px;
  background:linear-gradient(168deg,#FFF4E2,#FFF0EA);
  border-bottom:2px solid #FFE0C7;border-radius:0 0 20px 20px;
  box-shadow:0 4px 14px rgba(255,150,90,.10);}
/* The Menu button and the done-count share one line; the date sits under them. */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.head h1{font-size:19px;margin:6px 0 7px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}
.bar{height:5px;background:#FBEBD3;border-radius:99px;overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05);}
.bar>i{display:block;height:100%;width:0;transition:width .3s ease;border-radius:99px;
  background:linear-gradient(90deg,#FF6A45,#FFC531 55%,#12B9A6);}
.count{font-size:12px;color:var(--muted);font-weight:600;flex:0 0 auto;}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:700;margin:14px 4px 5px;display:flex;align-items:center;gap:8px;}
.list>.sec:first-child{margin-top:2px;}
.sec .sect{flex:1;min-width:0;overflow-wrap:anywhere;}
/* --muted, never --faint: CLAUDE.md's palette rule says --faint is decoration and fails as text */
.sec .secb,.sec .secn{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--muted);opacity:.8;}
.sec .secn{color:var(--muted);background:rgba(255,255,255,.66);border-radius:99px;
  padding:2px 8px;letter-spacing:0;}
/* ── Tab bar: situational tabs, horizontally scrollable, pinned under the header ── */
.tabs{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:2px 2px 2px;margin:7px 0 0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
@media (pointer:fine){
  .tabs{flex-wrap:wrap;overflow-x:visible;}
}
.tab{flex:0 0 auto;border:1px solid #F0DFC4;background:#fff;color:var(--ink);
  font-size:12.5px;font-weight:600;letter-spacing:-.005em;padding:6px 11px;border-radius:99px;
  cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;gap:5px;transition:.15s;}
.tab.active{font-weight:700;}
.tab .n{display:inline-block;min-width:18px;text-align:center;font-size:11.5px;font-weight:700;
  background:#FBEBD3;color:var(--muted);border-radius:99px;padding:1px 6px;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);
  box-shadow:0 3px 10px rgba(255,106,69,.30);}
.tab.active .n{background:rgba(255,255,255,.28);color:#fff;}
.tab.empty{opacity:.45;}
.tab.reference{border-color:#BFE3DC;}
.tab.reference.active{background:var(--sea);border-color:var(--sea);
  box-shadow:0 3px 10px rgba(18,185,166,.30);}
.card{display:flex;gap:12px;background:var(--card);border:1px solid #F4EAD9;
  border-radius:18px;padding:15px;margin-bottom:12px;
  box-shadow:0 3px 12px rgba(120,150,140,.10);}
.card.alert{border-color:#FFC9B6;background:var(--alert-bg);}
.card.is-done{display:none;}
.card.fresh-done{opacity:.4;background:var(--paper);box-shadow:none;}
.card.fresh-done .name,.card.fresh-done .ctx{font-weight:400;}
.card.fresh-done.alert{border-color:var(--line);}
.sec.refsec{color:var(--muted);}
.sec.refsec .sect{font-weight:600;}
.refcar{display:inline-block;margin-right:6px;transition:transform .12s ease;color:var(--coral-ink);}
.sec.refsec.open .refcar{transform:rotate(90deg);}
.list.show-done .card.is-done{display:flex;opacity:.5;}
.card.is-done .draft,.card.is-done .copy{display:none;}
.done{flex:0 0 auto;cursor:pointer;padding:8px;margin:-6px -8px -8px -8px;}
.done input{position:absolute;opacity:0;width:44px;height:44px;margin:-8px;}
.done span{display:block;width:28px;height:28px;border:2.5px solid #E7D8BF;
  border-radius:9px;transition:.15s;position:relative;background:#fff;}
.done input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px;
  box-shadow:0 0 0 3px rgba(255,106,69,.18);border-color:var(--accent);}
.done input:checked+span{background:var(--sea);border-color:var(--sea);
  box-shadow:0 2px 8px rgba(18,185,166,.35);}
.done input:checked+span:after{content:"";position:absolute;left:9px;top:4px;
  width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg);}
.body{flex:1;min-width:0;}
.chead{display:flex;align-items:center;gap:9px;width:100%;min-height:var(--tap,44px);
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;
  cursor:pointer;-webkit-tap-highlight-color:transparent;}
.card:not(.open) .chead{min-height:44px;}
.card:not(.open) .chead .badge{margin:0;}
.chead .nm{flex:1;min-width:0;}
/* First try here was nowrap + ellipsis on .nm. It LOOKED right and the render audit failed it:
   the clipped child span still measures 542px against a 485px viewport, and a box escaping the
   viewport is exactly what that audit exists to catch. Wrapping keeps every box inside the
   viewport, and it never hides half a card name from her — a truncated name is not a card she
   can act on. `anywhere` stops one long unbroken token doing the same thing. */
.chead .nm{overflow-wrap:anywhere;}
.card:not(.open) .chead .badge{margin-bottom:0;}
.chead .chev{flex:0 0 auto;font-size:22px;line-height:1;color:var(--muted);
  transition:transform .18s ease;}
.card.open .chead .chev{transform:rotate(90deg);}
.cbody{display:none;}
.card.open .cbody{display:block;}
.card:not(.open){padding:2px 12px 3px;margin-bottom:5px;border-radius:13px;
  box-shadow:0 1px 4px rgba(120,150,140,.07);}
/* the chevron only has to say "there is more inside" — at 22px with a 9px gap it was eating
   width the NAME needed, and a name wrapping to three lines is real cost for a decoration */
.card:not(.open) .chead{gap:6px;}
.card:not(.open) .chead .chev{font-size:17px;opacity:.7;}
.b-sens{background:var(--alert);color:#fff;padding:3px 9px;border-radius:99px;
  letter-spacing:.04em;}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;
  color:var(--muted);opacity:.85;margin-right:2px;}
.b-msg,.b-text,.b-email,.b-post,.b-task{background:none;padding:0;}
.b-msg{color:#0A786B} .b-text{color:#8B670C} .b-email{color:#6C6942}
.b-post{color:#B73F20} .b-task{color:#76694B}
.nm{font-weight:600;font-size:15px;line-height:1.32;letter-spacing:-.005em;}
.typ{font-weight:400;color:var(--muted);font-size:13.5px;}
.ctx{font-size:13px;color:#4F6A5F;margin:4px 0 0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
.tdetail{margin:8px 0 0;padding-left:20px;}
.tdetail li{font-size:14px;line-height:1.5;color:#3A4E48;font-weight:400;margin:4px 0;}
.blink{color:var(--coral-ink);font-weight:700;text-decoration:underline;text-underline-offset:2px;}
.tdetail li::marker{color:var(--accent);}
.tsub{margin:4px 0 2px;padding-left:18px;list-style:circle;}
.tsub li{font-size:13.5px;line-height:1.45;color:#4A5E58;margin:2px 0;}
.tsub li::marker{color:var(--sea);}
.gfx{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 0;}
.gfxi{width:104px;height:104px;object-fit:cover;border-radius:12px;border:1px solid #F0DFC4;
  box-shadow:0 2px 8px rgba(120,150,140,.12);cursor:pointer;}
.gfxi:focus-visible,.gfxzip:focus-visible,.copy:focus-visible,.tab:focus-visible,.reset:focus-visible,
.done input:focus-visible + span{outline:3px solid var(--accent);outline-offset:2px;}
.gfxzip{display:inline-block;margin:10px 0 0;padding:10px 16px;border-radius:12px;background:var(--sea);
  color:#fff;font-size:13px;font-weight:800;text-decoration:none;box-shadow:0 3px 10px rgba(18,185,166,.3);}
/* the real save route: hands the card's photos to the phone's share sheet as files */
.gfxsave{display:block;width:100%;margin:10px 0 0;min-height:var(--tap,48px);border:1px solid #CDE9E3;
  border-radius:12px;background:#EAF8F4;color:var(--sea-deep);font-size:14px;font-weight:800;
  font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.gfxsave:active{transform:scale(.98);}
.gfxsave.ok{background:var(--sea);border-color:var(--sea);color:#fff;}
.gfxsave:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
/* in-app lightbox — tap a graphic to view/save full-size without leaving the app */
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,30,28,.92);display:none;
  align-items:center;justify-content:center;padding:20px;}
.lb.on{display:flex;}
.lb img{max-width:100%;max-height:82vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.lb .x{position:absolute;top:14px;right:16px;width:44px;height:44px;border-radius:50%;border:0;
  background:rgba(255,255,255,.15);color:#fff;font-size:22px;font-weight:800;cursor:pointer;}
.lb .hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:13px;
  font-weight:600;opacity:.9;}
.lb .lbsave{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);min-height:var(--tap,48px);
  padding:0 26px;border:0;border-radius:99px;background:var(--sea);color:#fff;font-size:15px;
  font-weight:800;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 16px rgba(0,0,0,.35);}
.lb .lbsave.ok{background:var(--accent);}
.lb .lbsave:focus-visible{outline:3px solid #fff;outline-offset:2px;}
.draft{white-space:pre-wrap;word-wrap:break-word;background:#FFFBF3;
  border:1px dashed #F0DFC4;border-radius:12px;padding:12px;margin:11px 0 0;
  font-size:15px;line-height:1.5;color:#3A4E48;}
.copy{margin-top:11px;width:100%;min-height:48px;border:0;border-radius:12px;
  background:var(--coral-ink);color:var(--accent-ink);font-size:15px;font-weight:800;
  cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;
  box-shadow:0 3px 10px rgba(255,106,69,.30);}
.copy:active{transform:scale(.98);}
.copy.ok{background:var(--sea);box-shadow:0 3px 10px rgba(18,185,166,.35);}
.list{display:flex;flex-direction:column;}
.card{transition:opacity .2s ease;}
.donebar{display:none;text-align:center;margin:18px 0 4px;}
/* was color:var(--sea) = 2.26:1 on this tint. CLAUDE.md already says --sea fails as text. */
.donebar button{border:1px solid #CDE9E3;background:#EAF8F4;color:var(--sea-deep);
  font-size:12px;font-weight:800;letter-spacing:.04em;padding:9px 16px;border-radius:99px;
  min-height:var(--tap,44px);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.donebar .reset{display:block;margin:10px auto 0;border:0;background:none;color:var(--muted);
  font-size:11px;text-decoration:underline;cursor:pointer;}
.stale{background:var(--alert-bg);color:var(--alert);border:1px solid #FFC9B6;
  border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:13px;font-weight:700;text-align:center;}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px;line-height:1.5;}

/* the Now card: soft coral glow, one chip, a 5px dot on its tab. Invites, never nags. */
.card.now{box-shadow:0 0 0 2px var(--accent), 0 8px 22px rgba(255,106,69,.28);}
.nowchip{display:inline-block;background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:999px;margin-bottom:2px;}
.lchip.hasnow::after{content:"";position:absolute;top:2px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
.alldone{display:none;text-align:center;padding:36px 22px 10px;color:var(--ink);font-weight:700;font-size:17px;}
.alldone .sub{margin-top:6px;font-weight:600;font-size:13.5px;color:#4F6A5F;}
.card{flex-wrap:wrap;}

.card,.sec{border-left:3px solid transparent;}
.sec{padding-left:9px;}
.card[data-kind="host"]{border-left-color:var(--accent);}      /* host messages — most critical */
.card[data-kind="guest"]{border-left-color:var(--sea);}        /* guest messages + waves */
.card[data-kind="task"]{border-left-color:var(--sun);}         /* tasks + party setup */
.card[data-kind="vip"]{border-left-color:var(--sea-deep);}     /* her VIP group DMs */
.card[data-kind="content"],.card[data-kind="party"]{border-left-color:var(--faint);}
.sec[data-kind="host"]{border-left-color:var(--accent);}
.sec[data-kind="guest"]{border-left-color:var(--sea);}
.sec[data-kind="task"]{border-left-color:var(--sun);}
.sec[data-kind="vip"]{border-left-color:var(--sea-deep);}
.sec[data-kind="content"],.sec[data-kind="party"]{border-left-color:var(--faint);}
:root{--denim:#38618C;--sun-ink:#8A6D00;}
.card[data-mtype="reply"]{border-left-color:var(--sea);}
.card[data-mtype="thanks"],.card[data-mtype="fit"]{border-left-color:var(--accent);}
.card[data-mtype="reconnect"],.card[data-mtype="birthday"]{border-left-color:var(--denim);}
.card[data-mtype="alert"],.card[data-mtype="ask"]{border-left-color:var(--sun);}
.card[data-mtype="exchange"],.card[data-mtype="other"]{border-left-color:var(--faint);}
.sec.mshelf[data-mtype="reply"]{border-left-color:var(--sea);}   .sec.mshelf[data-mtype="reply"] .sect{color:var(--sea-deep);}
.sec.mshelf[data-mtype="thanks"],.sec.mshelf[data-mtype="fit"]{border-left-color:var(--accent);}
.sec.mshelf[data-mtype="thanks"] .sect,.sec.mshelf[data-mtype="fit"] .sect{color:var(--coral-ink);}
.sec.mshelf[data-mtype="reconnect"],.sec.mshelf[data-mtype="birthday"]{border-left-color:var(--denim);}
.sec.mshelf[data-mtype="reconnect"] .sect,.sec.mshelf[data-mtype="birthday"] .sect{color:var(--denim);}
.sec.mshelf[data-mtype="alert"],.sec.mshelf[data-mtype="ask"]{border-left-color:var(--sun);}
.sec.mshelf[data-mtype="alert"] .sect,.sec.mshelf[data-mtype="ask"] .sect{color:var(--sun-ink);}
.sec.mshelf[data-mtype="exchange"] .sect,.sec.mshelf[data-mtype="other"] .sect{color:var(--muted);}
.sec.mshelf .shn{font-weight:600;color:var(--muted);margin-left:6px;}
.card[data-mtype="remind"],.sec.mshelf[data-mtype="remind"]{border-left-color:var(--faint);}
.sec.mshelf[data-mtype="remind"] .sect{color:var(--muted);}
.sec.mshelf.remind .shn{font-weight:400;}
.card .due{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);margin-left:6px;white-space:nowrap;}
.card.duesoon .due,.sec.mshelf.remind.duesoon .shn{color:var(--sun-ink);}
.secbtn{display:flex;align-items:center;gap:8px;flex:1;min-width:0;min-height:44px;margin:-12px 0;padding:0;
  border:0;background:none;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;
  text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.secbtn .sect{flex:1;min-width:0;}
.sec.mshelf .refcar{display:inline-block;margin-right:6px;transition:transform .12s ease;color:var(--coral-ink);flex:0 0 auto;}
.sec.mshelf.open .refcar{transform:rotate(90deg);}
#scriptshelf{padding:2px 0 30px;}
#scriptshelf .card{display:flex !important;}
#scriptshelf h2.sec{display:block !important;}
#scriptshelf .bakwrap{display:none;}
#scriptshelf .bakwrap.open{display:block;}
.bakbar{display:flex;align-items:center;gap:8px;min-height:var(--tap,44px);margin:10px 0 4px;
  padding:6px 12px;border:1px dashed var(--line);border-radius:10px;background:none;
  color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;width:100%;text-align:left;}
.lchips.lmode{margin-bottom:8px;}

.runbar{display:flex;align-items:center;gap:8px;cursor:pointer;
  margin:0 4px 8px;padding:7px 11px;border-radius:12px;
  background:rgba(255,255,255,.66);border:1px solid var(--line);
  font-size:11.5px;letter-spacing:.03em;color:var(--muted);}
.runbar.shelfsole{display:none!important}
.runbar .runlab{font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
.runbar .runprog{flex:1;min-width:0;}
.runbar .runmore{flex:0 0 auto;font-weight:700;color:var(--coral-ink);}
.runbar.allofit .runmore{color:var(--muted);}
.sec.runsec{cursor:pointer;flex-wrap:wrap;}
.sec.runsec .sect{flex:1 1 60%;}
.sec.runsec .refcar{display:inline-block;transition:transform .15s ease;flex:0 0 auto;}
.sec.runsec.open .refcar{transform:rotate(90deg);}
.sec .secrun{flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.06em;
  color:var(--coral-ink);text-transform:uppercase;opacity:.9;}
.card .done{display:none;}   /* the native checkbox still drives state/sync — hidden; radios control it */
.fbseg{flex-basis:100%;width:100%;display:flex;flex-direction:row;gap:6px;margin-top:8px;}
.card:not(.open) .body{flex:1 1 170px;}
.card:not(.open) .fbseg{flex:0 0 auto;width:auto;margin:0 0 0 auto;}
/* flex:0 0 auto, NOT the open card's 1 1 0: a zero basis collapses each button to its padding,
   which is what turned these into "✗ Ski…". Collapsed, each button is as wide as its own word. */
.card:not(.open) .fbseg button{flex:0 0 auto;min-height:32px;min-width:44px;font-size:11.5px;padding:3px 9px;position:relative;}
.card:not(.open) .fbseg button::before{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px;}
.fbseg .ss{display:none;} .card:not(.open) .fbseg .sl{display:none;}
.card:not(.open) .fbseg .ss{display:inline;}
/* Her actual phone is 390px wide, and 170 + three buttons does not fit there — measured on a
   real 390 reflow, not on the 500px screenshot Chrome clamps to. A few pixels off the buttons
   and the name floor keeps the one-line row on the device she actually uses. */
@media (max-width:430px){
  /* MEASURED, not guessed. A 390px phone reports a 375px viewport; after the page gutters and
     the card's own padding a collapsed row has 317px, the three buttons measure 176px, and the
     card's flex gap takes 12 — so the name's flex-BASIS has to sit under ~129 or the row wraps
     and every card costs two lines. It is only a floor: flex-grow hands the leftover width back,
     so the name still gets ~129px and a long one wraps inside its own column while the verdict
     stays put on line one. First attempt used 148 and wrapped all 27 cards. */
  .card:not(.open) .body{flex:1 1 100px;}
  .card:not(.open) .fbseg{gap:4px;}
  .card:not(.open) .fbseg button{font-size:11px;padding:3px 4px;}
}
.fbseg button{flex:1 1 0;min-width:0;min-height:40px;font-size:12.5px;font-weight:600;padding:5px 2px;border-radius:9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fbseg button.sent{background:var(--card);border:1px solid #CFE7E2;color:#1E7A6F;}
.fbseg button.modified{background:var(--card);border:1px solid #EEDDB4;color:#8A6714;}
.fbseg button.skipped{background:var(--card);border:1px solid #F0D6CE;color:#A8503C;}
.fbseg button.on.sent{background:var(--sea);border-color:var(--sea);color:#fff;}
.fbseg button.on.modified{background:#D9A62E;border-color:#D9A62E;color:#fff;}
.fbseg button.on.skipped{background:#C46A6A;border-color:#C46A6A;color:#fff;}
.fbbox{flex-basis:100%;width:100%;margin-top:8px;}
.fbbox textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--card);color:var(--ink);}
.fbact{display:flex;gap:6px;margin-top:6px;}
.fbact button{font-size:11.5px;font-weight:600;padding:6px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;}
.fbact button.save{background:var(--accent);border-color:var(--accent);color:#fff;}
.fbnote{flex-basis:100%;width:100%;margin-top:6px;font-size:12.5px;color:#4F6A5F;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card.skipped{opacity:.55;}
.weighbox{flex-basis:100%;width:100%;margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.weighbox label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);}
.weighbox input{width:104px;min-height:var(--tap,44px);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px;background:var(--card);color:var(--ink);}
.weighbox button{min-height:var(--tap,44px);font-size:11.5px;font-weight:600;padding:6px 16px;border-radius:9px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
.wnote{flex-basis:100%;font-size:12px;color:#4F6A5F;}
.wnote.werr{color:#C46A6A;font-weight:600;}
#notesbox{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 14px;background:var(--card);}
.notes-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.notes-clear{font-size:11px;font-weight:600;padding:5px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent;}
#notesarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);resize:vertical;}
#notesarea::placeholder{color:var(--muted);} 
.loading-shell{display:flex;flex-direction:column;gap:12px;padding:18px 16px 28px;}
.loading-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 14px -12px rgba(120,70,40,.4);}
.loading-line{height:12px;border-radius:999px;background:linear-gradient(90deg,#F2E9D8 25%,#FAF3E1 50%,#F2E9D8 75%);background-size:200% 100%;animation:shimmer 1.15s infinite;}
.loading-line.short{width:55%;margin-top:8px;}
.loading-line.tall{width:78%;margin-top:12px;}
.loading-line.small{width:38%;margin-top:10px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
/* the sticky header: one row of controls, one line of date + status, the bar, one chip row */
.hrow{min-height:44px;}
.ctx{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.ctx b{font-weight:700;}
.hline{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600;margin:2px 0 6px;min-height:18px;}
.hline .hl{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hline .hl .lclock{color:var(--ink);}
.hline .hl .lwarn{color:#B33A2E;}
.status{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.status:empty{display:none;}
.status.pending{color:#8A6415;} .status.error{color:#B33A2E;} .status.info{color:var(--sea-deep);}
.status .stbtn{min-height:44px;margin:-13px 0;padding:0 6px;border:0;background:none;color:inherit;font:inherit;font-weight:700;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.subrow{margin-top:8px;padding-bottom:2px;gap:6px;}
.lchip.lane.on{background:var(--sea,#12B9A6);border-color:var(--sea,#12B9A6);color:#fff;}
.lchip.lane.on .lcn{opacity:.85;}
.lsep{flex:none;width:1px;height:18px;background:var(--line);margin:0 2px;align-self:center;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
.resetbar{text-align:center;margin:26px 0 0;padding-top:14px;border-top:1px dashed var(--line);}
.resetbar .reset{min-height:44px;border:0;background:none;color:var(--muted);font-size:12px;
  text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-family:inherit;}
#libview{padding:2px 14px 30px;}
.lsearch input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--ink);margin:4px 0 10px;}
.lchips{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
@media (pointer:fine){
  .lchips{flex-wrap:wrap;overflow-x:visible;}
  .lstrip{scrollbar-width:thin;}
}
.lchips::-webkit-scrollbar{display:none;}
.lchip{flex:none;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;cursor:pointer;
  position:relative;font-family:inherit;-webkit-tap-highlight-color:transparent;}
/* a compact pill with a 44px hit box: the pseudo-element takes the tap, the pill keeps its size */
.lchip::before{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px;}
.lchip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.lchip.empty{opacity:.6;}
.lsrcrow{padding-bottom:9px;margin-bottom:3px;border-bottom:1px solid var(--line);}
.lchip.src{font-weight:700;}
.lchip.src.on{background:var(--sea);border-color:var(--sea);color:#fff;}
.lcn{opacity:.65;font-weight:700;margin-left:2px;}
.lsrc{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--sea);border-radius:5px;padding:1px 5px;margin-bottom:4px;}
.lsrc.hhz{background:var(--accent);}
.lsrc.mine{background:#B29CC4;}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.lcard{display:block;width:100%;padding:0;margin:0;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px -12px rgba(120,70,40,.4);-webkit-tap-highlight-color:transparent;}
.lcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px;}
.lthumb{aspect-ratio:1/1.1;position:relative;background:var(--sand);}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.lpills{position:absolute;left:7px;bottom:7px;display:flex;gap:5px;flex-wrap:wrap;}
.lcount{position:absolute;right:7px;top:7px;background:rgba(20,20,25,.62);color:#fff;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;letter-spacing:.02em;}
.lpill{font-size:10px;font-weight:700;padding:3px 7px;border-radius:999px;}
.lpill.real{background:#B29CC4;color:#fff;}
.lpill.stock{background:var(--sea);color:#fff;}
/* instrumentation, not emphasis — same dark chip the photo count already wears */
.lpill.soft{background:rgba(20,20,25,.62);color:#fff;font-weight:600;}
.lstripb.soft{position:relative;}
.lstripb.soft::after{content:"low-res";position:absolute;left:5px;bottom:5px;background:rgba(20,20,25,.68);
  color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.02em;padding:1px 5px;border-radius:999px;}
.lhint.soft{color:var(--muted);}
.lmeta{padding:9px 10px 11px;}
.lp{font-weight:700;font-size:13px;color:var(--ink);line-height:1.2;}
.lsnip{color:var(--muted);font-size:11.5px;margin-top:3px;line-height:1.35;max-height:2.7em;overflow:hidden;}
.lempty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}
.lnoimg{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;font-size:30px;}
.lnoimg span{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:0 10px;}
.lhint{font-size:11.5px;color:#4F6A5F;margin:2px 0 6px;}
.libscrim{position:fixed;inset:0;background:rgba(40,30,20,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
.libscrim.show{opacity:1;pointer-events:auto;}
.libsheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:41;max-height:88%;display:flex;flex-direction:column;box-shadow:0 -12px 40px -14px rgba(40,20,10,.5);}
.libsheet.show{transform:translateY(0);}
.lgrab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:9px auto 4px;}
.libsheet-body{overflow-y:auto;padding:6px 18px 4px;}
.lstrip{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none;}
.lstrip::-webkit-scrollbar{display:none;}
.lstripb{flex:none;padding:0;border:0;background:none;border-radius:12px;cursor:pointer;}
.lstrip img{display:block;width:106px;aspect-ratio:1/1.2;object-fit:cover;border-radius:12px;}
.libsheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 18px 4px;}
.libsheet-head h3{margin:0;font-size:17px;color:var(--ink);flex:1;min-width:0;}
.lclose{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--sand);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.lloading{color:var(--muted);font-size:13px;padding:30px 0;text-align:center;}
.lcap{background:var(--sand);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:13.5px;white-space:pre-line;color:var(--ink);line-height:1.5;}
.libsheet-actions{display:flex;gap:9px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.lbtn{flex:1;border:none;border-radius:12px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.lbtn.primary{background:var(--accent);color:#fff;}
.lbtn.ghost{background:var(--sand);color:var(--ink);border:1px solid var(--line);}
.lremove{display:block;width:100%;margin:10px 0 2px;min-height:44px;background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--muted);font:inherit;font-size:14px;font-weight:500;cursor:pointer;}
.lremove[hidden]{display:none;}
.ltoast .lundo{margin-left:10px;background:transparent;border:1px solid currentColor;border-radius:8px;color:inherit;font:inherit;font-size:13px;padding:4px 10px;min-height:32px;cursor:pointer;}
.ltoast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,14px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:50;}
.ltoast.show{opacity:1;transform:translate(-50%,0);}
.psubrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
.psubrow::-webkit-scrollbar{display:none;}
.psubrow button{flex:none;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap;cursor:pointer;}
.psubrow button.on{background:var(--sea);border-color:var(--sea);color:#fff;}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 14px -12px rgba(120,70,40,.4);}
.pcard .pday{font-weight:800;font-size:13px;color:var(--accent);margin-bottom:6px;}
.pslot{display:flex;align-items:baseline;gap:6px;margin:5px 0;}
.pslot .pname{font-weight:700;font-size:12.5px;color:var(--ink);}
.pslot .ptime{font-size:11px;color:var(--muted);}
.pcap{background:var(--sand);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;white-space:pre-line;color:var(--ink);line-height:1.45;margin-top:6px;}
.pcopybtn{font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;margin-top:8px;}
.pempty{color:var(--muted);font-size:12.5px;font-style:italic;}
.pwhen{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:2px;}
.plabel{font-size:11.5px;font-weight:700;color:var(--sea);margin:10px 0 2px;}
/* passphrase gate */
.gate{max-width:420px;margin:16vh auto 0;padding:0 22px;text-align:center;}
.gate .gmark{display:block;width:170px;max-width:72%;height:auto;margin:0 auto 4px;}
.gate h1{font-size:22px;color:var(--ink);margin:6px 0 4px;}
.cheer{background:linear-gradient(100deg,#FFF3D6,#FFE9E2);border:1.5px solid var(--sun,#FFC531);border-radius:14px;padding:9px 13px;margin:8px 0 2px;font-size:13.5px;line-height:1.45;color:var(--ink,#2B4F48)}
/* --ink, NOT --sea-ink. In THIS file --sea-ink is #fff — it means "text ON a sea fill", the
   inverse of studio_theme.py's token of the same name. The cheer's non-bold half rendered
   white on cream at 1.13:1 and was invisible on her phone; the bold half was fine, so it read
   as a sentence that stopped halfway. Caught by a rendered-contrast check, not by any of the
   8 packet verifications — none of them can see colour. */
.cheer b,.cheer strong{color:var(--coral-ink,#C43D1E)}
.cheer sub{display:block;font-size:10px;color:var(--muted,#7C8A85);margin-top:3px;letter-spacing:.02em}
.gate p{color:var(--muted);font-size:14px;margin:0 0 20px;}
.gate input{width:100%;min-height:52px;border:2px solid #F1E7D6;border-radius:14px;
  padding:0 16px;font-size:17px;background:#fff;color:var(--ink);margin-bottom:12px;}
.gate input:focus{outline:none;border-color:var(--accent);}
.gate button{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--accent);
  color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(255,106,69,.3);}
.gate .err{color:var(--alert);font-size:13px;font-weight:700;min-height:18px;margin-top:10px;}
.hide{display:none!important;}
.landing{display:none;position:fixed;inset:0;z-index:30;overflow-y:auto;flex-direction:column;
  background:linear-gradient(180deg,#F85A40 0%,#F0C130 45%,#5EAD80 100%);}
html.landing-active,html.landing-active body{background:linear-gradient(90deg,#F85A40,#F97038)!important;}
.splash-top{width:100%;height:auto;display:block;flex:0 0 auto;}
.menu-wrap{flex:1 1 auto;padding:10px 20px 40px;display:flex;flex-direction:column;}
.menu-prompt{color:var(--ink);font-size:15px;font-weight:800;text-align:center;margin:4px 0 18px;letter-spacing:-.01em;}
.menu-grid{display:flex;flex-direction:column;gap:12px;}
.menu-pill{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:56px;
  padding:0 22px;border:none;border-radius:999px;background:#fff;color:var(--ink);font-size:16px;
  font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 10px rgba(80,50,10,.16);
  transition:transform .15s cubic-bezier(.22,1,.36,1);-webkit-tap-highlight-color:transparent;position:relative;}
.menu-pill:active{transform:scale(.97);}
/* A lane door names itself on line 1 and says what it holds on line 2. The sub-line is CHROME
   (11px, muted, never bold) — the packet-list law: separation comes from size and colour, never
   from bolding one more thing. It is what stops her opening a door to find out what is in it. */
.lane-door{align-items:flex-start;padding-top:11px;padding-bottom:11px;}
.ldname{display:flex;flex-direction:column;gap:3px;text-align:left;font-weight:600;}
.ldsub{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.01em;line-height:1.35;}
a.menu-pill{text-decoration:none;color:inherit;}
.menu-pill .arrow{color:var(--accent);font-weight:800;margin-left:10px;}
.menu-pill .pillright{display:flex;align-items:center;gap:10px;}
.menu-pill .mcount{min-width:26px;text-align:center;background:var(--accent);color:#fff;
  font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.menu-pill.inactive{opacity:.72;box-shadow:0 1px 4px rgba(80,50,10,.08);}
.menu-pill.inactive .mcount{background:#E7E2DA;color:#8B8579;font-weight:700;}
.menu-pill.reference{background:rgba(255,255,255,.78);box-shadow:0 2px 6px rgba(80,50,10,.10);}
.menu-pill .mtag{background:#EFEAE2;color:#8B8579;font-size:11.5px;font-weight:700;
  padding:3px 10px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;}
.menu-pill.hasnow::before{content:"";position:absolute;top:9px;right:16px;width:7px;height:7px;
  border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px #fff;}
@media (prefers-reduced-motion: reduce){ .menu-pill{transition:none;} }
.menu-back{display:inline-flex;align-items:center;min-height:44px;border:1.5px solid var(--line);
  background:#fff;color:var(--ink);font-size:15px;font-weight:800;border-radius:999px;
  padding:0 18px;margin:0 0 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.menu-back:active{transform:scale(.97);}
.lane-sec{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;opacity:.9;margin:18px 4px 9px;text-shadow:0 1px 4px rgba(80,40,10,.22);}
</style>
</head>
<body>
<div class="wrap" id="app" style="display:none">
  <div id="loading" class="loading-shell" style="display:block">
    <div class="loading-card">
      <div class="loading-line tall"></div>
      <div class="loading-line short"></div>
      <div class="loading-line small"></div>
    </div>
    <div class="loading-card">
      <div class="loading-line"></div>
      <div class="loading-line short"></div>
      <div class="loading-line small"></div>
    </div>
  </div>
  <div class="head">
    <!-- The sticky region is capped at: one control row (Menu, where-am-I, done count), one
         line of date plus status, the progress bar, and ONE chip row. Everything else scrolls. -->
    <div class="hrow">
      <button type="button" class="menu-back" onclick="backToMenu()">&larr; Menu</button>
      <div class="ctx" id="ctx"></div>
      <div class="count" id="count">0 done</div>
    </div>
    <div class="hline"><span class="hl"><span id="date">Today</span><span id="lclock"></span></span><span class="status" id="status" role="status" aria-live="polite"></span></div>
    <div class="bar" id="barwrap" role="progressbar" aria-label="Today's progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="fill"></i></div>
    <div class="lchips subrow" id="lanetools" style="display:none" role="group" aria-label="Where to work"></div>
  </div>
  <div id="cheer" class="cheer" style="display:none"></div>
  <div id="stalewrap"></div>
  <div class="list" id="list"></div>
  <div id="notesbox" style="display:none">
    <div class="notes-head">📝 Today's Notes<button type="button" class="notes-clear" onclick="clearNotes()">Clear</button></div>
    <textarea id="notesarea" aria-label="Today's notes" placeholder="Voice-transcribe or jot anything top of mind — stays here until you clear it, doesn't send anywhere." oninput="saveNotes()"></textarea>
  </div>
  <div id="libview" style="display:none"></div>
  <div id="refview" style="display:none"></div>
  <div class="donebar" id="donebar">
    <button id="donetoggle" type="button" onclick="toggleDone()"></button>
  </div>
  <div class="foot">Progress is saved on this phone and synced when connected.</div>
  <div class="resetbar"><button type="button" class="reset" onclick="resetDay()">Start today over on this phone</button></div>
  <div id="sr" class="sr" role="status" aria-live="polite"></div>
</div>

<div class="gate" id="gate">
  <img class="gmark" src="landing-logo.png" alt="">
  <h1>Jessica Lorae</h1>
  <p id="gatehint">Enter your passphrase to unlock your day.</p>
  <input id="pass" type="password" inputmode="text" autocomplete="current-password"
         placeholder="Passphrase" enterkeyhint="go" aria-label="Passphrase" aria-describedby="gatehint err">
  <button type="button" onclick="unlock()">Unlock</button>
  <div class="err" id="err" role="alert"></div>
</div>

<div class="landing" id="landing">
  <img class="splash-top" src="landing-logo.png" alt="Health, Happiness &amp; Zyia Active by Jessica">
  <div class="menu-wrap">
    <div class="lane-sec">&#9989; Daily Actions</div>
    <div class="menu-grid" id="zyActGrid"></div>
    <div class="lane-sec">&#128218; Reference</div>
    <div class="menu-grid" id="zyRefGrid"></div>
    <div id="ccLane" style="display:none">
      <div class="lane-sec">&#128202; Dashboards</div>
      <div class="menu-grid" id="ccGrid"></div>
    </div>
  </div>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo" onclick="if(event.target.id==='lb')closeLb()">
  <button class="x" type="button" onclick="closeLb()" aria-label="Close photo">✕</button>
  <img id="lbimg" src="" alt="Photo, full size">
  <button class="lbsave" type="button" onclick="saveLbImg(this)">⬇ Save to my photos</button>
</div>

<div class="libscrim" id="libscrim" onclick="closeCard()"></div>
<div class="libsheet" id="libsheet" role="dialog" aria-modal="true" aria-labelledby="libsheet-title">
  <div class="lgrab"></div>
  <div class="libsheet-head"><h3 id="libsheet-title"></h3><button type="button" class="lclose" onclick="closeCard()" aria-label="Close this post">Close</button></div>
  <div class="libsheet-body" id="libsheet-body"></div>
  <div class="libsheet-actions">
    <button class="lbtn ghost" type="button" onclick="saveLibImgs(this)">⬇ Save photos</button>

var _KEYS = {};
/* one key derivation per salt: the day's cards and the Library share a salt, so opening the
   Library later costs a decrypt, not a second 250k-round derivation */
async function deriveKey(pass, salt){
  var sk = pass + "|" + Array.prototype.join.call(salt, ",");
  if(_KEYS[sk]) return _KEYS[sk];
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass),
              {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
              {name:"PBKDF2", salt, iterations:ITERS, hash:"SHA-256"},
              km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  _KEYS[sk] = key;
  return key;
}
async function decryptBlob(pass, b64){
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), data = raw.slice(28);
  const key = await deriveKey(pass, salt);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, data);
  return new TextDecoder().decode(pt);
}

async function unlock(){
  const pass = document.getElementById("pass").value.trim();
  const err = document.getElementById("err");
  if(!pass){ err.textContent = "Type your passphrase."; return; }
  err.textContent = "Unlocking…";
  try{
    const json = await decryptBlob(pass, BLOB);
    localStorage.setItem("pp", pass);          // remember on THIS device (type once)
    const p = JSON.parse(json);
    err.textContent = "";
    render(p);
    document.getElementById("gate").classList.add("hide");
    var auto = null, back = null;
    try{
      auto = sessionStorage.getItem("pp-auto");
      back = sessionStorage.getItem("pp-open");
      sessionStorage.removeItem("pp-auto");
    }catch(e){}
    if(auto && back) resumeView(back);       // came back from another app — resume where she was
    else showLanding();
  }catch(e){ err.textContent = "That passphrase didn't work. Try again."; }
}

  mountScripts();

    /* this device's own verdict wins; 0 = she reopened it here (same-day undo, 2026-10-02);
       with neither, a done-in-the-queue card (data-qdone) paints the queue's own record */
    var v = s[cb.dataset.id];
    if(v === 0) v = undefined;

    paintVerdict(card, cb, v);
  });

  // exactly as before. Only what she finishes from here on stays in place under her finger.
  settleDone();

  refresh();

  document.getElementById("list").style.display = "";

  document.getElementById("notesbox").style.display = "none";
  document.getElementById("libview").style.display = "none";

  else if(CAT === "library") openLibrary();
  else if(CAT === "refs") openRefs();
  else reflow();
}

function laneCatCounts(key){

    if(el.getAttribute("data-ref") === "1" || !isOpenCard(el)) return;

    if(kp.host){

      if(kp.host === HOSTSHARED ? !!h : h !== kp.host) return;

function buildMsgShelves(){

     a data-run, so a folded run stayed at its original spot in the list — which, once the

     showed 1; the missing five sat behind an unlabelled "Same message · 7 people" bar parked

     cards away from that header would hide them for good (the 2026-08-18 fold deadlock). */
  var units = [], byRid = {};

    if(!el.classList) return;

function updateShelfCounts(){

     list (2026-09-11). Counting by type alone let the badge speak for cards parked elsewhere:
     ⏰ Reply owed promised 6 over a shelf holding 1. Walking the header's own run to the next

    return;
  }

  var token = await sha256hex(pp);
  var done = [];

    var k = keys[i], e = q[k]; e.tries += 1;
    var payload = (e.kind === "steps") ? {date: e.date, steps: e.v} : {date: e.date, lbs: e.v};
    try{
      var res = await fetch(WORKER_URL + "/edit", {method:"POST", keepalive:true,
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({kind: e.kind, data: payload, token: token})});
      var body = await res.json();
      if(body && body.r === "ok") done.push(k);
    }catch(err){ /* network — stays queued, next flush retries */ }
  }
  done.forEach(function(k){ delete q[k]; });
  saveGQ(q);

       done, an undo showing open — is proof it landed; only a build that contradicts it is a miss. */

  var srcs = [];
  LIB.forEach(function(c){ if(c.src && srcs.indexOf(c.src) < 0) srcs.push(c.src); });
  var srcrow = srcs.length>1 ? '<div class="lchips lsrcrow">'
    + srcs.map(function(s){ var n=LIB.filter(function(c){return c.src===s;}).length;
        return '<button type="button" class="lchip src" data-src="'+lesc(s)+'" aria-pressed="false" onclick="lsrc(this)">'+lesc(s)+' <span class="lcn">'+n+'</span></button>'; }).join("")
    + '</div>' : '';
  var chips = '<div class="lchips">'
    + '<button type="button" class="lchip" aria-pressed="false" onclick="ltoggle(this,\'stock\')">In stock</button>'
    + '<button type="button" class="lchip" aria-pressed="false" onclick="ltoggle(this,\'real\')">⭐ Real-people</button>'
    + cats.map(function(c){ return '<button type="button" class="lchip" aria-pressed="false" data-cat="'+lesc(c)+'" onclick="lcat(this)">'+lesc(c)+'</button>'; }).join("")
    + '</div>';
  v.innerHTML = moderow + '<div class="lsearch"><input id="lq" aria-label="Search your library" placeholder="Search product, color, vibe…" oninput="renderCards()" autocomplete="off"></div>' + srcrow + chips + '<div class="lgrid" id="lgrid"></div>';
  renderCards();
}
function pressed(btn, on){ btn.classList.toggle("on", on); btn.setAttribute("aria-pressed", on ? "true" : "false"); }
function ltoggle(btn,k){ LSTATE[k]=!LSTATE[k]; pressed(btn, LSTATE[k]); renderCards(); }
function lcat(btn){ var on=btn.classList.contains("on"); Array.prototype.slice.call(document.querySelectorAll('.lchip[data-cat]')).forEach(function(x){pressed(x,false);}); if(!on){pressed(btn,true);LSTATE.cat=btn.dataset.cat;}else{LSTATE.cat=null;} renderCards(); }
function lsrc(btn){ var on=btn.classList.contains("on"); Array.prototype.slice.call(document.querySelectorAll('.lchip[data-src]')).forEach(function(x){pressed(x,false);}); if(!on){pressed(btn,true);LSTATE.src=btn.dataset.src;}else{LSTATE.src=null;} renderCards(); }
function renderCards(){
  var qel=document.getElementById("lq"); var q=(qel?qel.value:"").toLowerCase().trim();
  var gone=loadLR();
  var rows=LIB.map(function(c,i){return {c:c,i:i};}).filter(function(o){
    var c=o.c;
    if(c.rid && gone[c.rid]) return false;     /* she removed it: posted or scheduled */
    if(LSTATE.src && c.src!==LSTATE.src) return false;
    if(LSTATE.cat && c.cat!==LSTATE.cat) return false;
    if(LSTATE.stock && !c.stock) return false;
    if(LSTATE.real && !c.real) return false;
    if(q && (c.p+" "+c.cat+" "+c.cap).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  document.getElementById("lgrid").innerHTML = rows.length ? rows.map(function(o){
    var c=o.c, img=c.imgs[0]||"";
    var ns=(c.soft||[]).reduce(function(a,b){return a+b;},0);
    /* A LABEL, NOT A HIGHLIGHT (2026-08-15 chrome rule): muted, on the photo's own dark chip
       style, so it reads as instrumentation and never competes with the picture. */
    var pills=(c.real?'<span class="lpill real">⭐</span>':"")+(c.stock?'<span class="lpill stock">● in stock</span>':"")
      +(ns?'<span class="lpill soft">'+(ns===c.imgs.length?"low-res":ns+" low-res")+'</span>':"");
    return '<button type="button" class="lcard" aria-label="Open '+lesc(c.p)+'" onclick="openCard('+o.i+',this)"><div class="lthumb">'
      +(img?'<img src="'+img+'" loading="lazy" alt="">':'<div class="lnoimg">📝<span>'+lesc(c.p)+'</span></div>')+'<div class="lpills">'+pills+'</div>'
      +(c.imgs.length>1?'<div class="lcount">▦ '+c.imgs.length+'</div>':"")+'</div>'
      +'<div class="lmeta"><div class="lsrc '+(c.src==="HHZ"?"hhz":c.src==="My Photos"?"mine":"")+'">'+lesc(c.src||"")+'</div>'
      +'<div class="lp">'+lesc(c.p)+'</div><div class="lsnip">'+lesc(c.cap.slice(0,72))+'</div></div></button>';
  }).join("") : '<div class="lempty">No posts match — clear a filter.</div>';
}
function openCard(i, opener){
  var c=LIB[i]; if(!c) return;
  var fl=c.fulls||[];
  /* data-packed is the embedded copy and never changes; src is free to upgrade for display. */
  var sf=c.soft||[];
  var strip=c.imgs.map(function(u,i){return '<button type="button" class="lstripb'+(sf[i]?' soft':'')+'" aria-label="Open photo '+(i+1)+' of '+c.imgs.length+(sf[i]?', low resolution':'')+'" onclick="openLb(this.firstChild.dataset.full||this.firstChild.src,this)"><img src="'+u+'" data-packed="'+u+'"'+(fl[i]?' data-full="'+fl[i]+'"':'')+' alt=""></button>';}).join("");
  var ns=sf.reduce(function(a,b){return a+b;},0);
  /* THE UPGRADE LINE ONLY APPEARS WHEN THERE IS ONE (2026-09-22). `fl` is an array with one
     entry per photo and the entry is "" for anything private — which is every photo she owns —
     so `fl.length` was true on all 185 and the app promised a sharpening that could never
     happen. A message that is false on every card is worse than no message. */
  var hint = (fl.some(Boolean) ? '<div class="lhint">Photos sharpen to full quality as they load · Save photos sends them all to your camera roll</div>' : '<div class="lhint">Save photos sends them all to your camera roll</div>')
    + (ns ? '<div class="lhint soft">'+(ns===c.imgs.length?'These photos are':ns+' of these photos are')+' low-resolution at the source — marked on each one. Swap them when you have a better shot.</div>' : "");
  document.getElementById("libsheet-title").textContent = c.p;
  document.getElementById("libsheet-body").innerHTML='<div class="lstrip">'+strip+'</div>'+hint+'<div class="lcap">'+lesc(c.cap)+'</div>';
  document.querySelectorAll("#libsheet-body .lstrip img[data-full]").forEach(function(img){
    var full = img.dataset.full;
    var hi = new Image();
    hi.onload = function(){ img.src = full; };
    hi.src = full;
  });
  var rb=document.getElementById("lremove"); if(rb){ rb.hidden=!c.rid; }
  var sh=document.getElementById("libsheet"); sh.dataset.rid=c.rid||""; sh.dataset.cap=c.cap; sh.dataset.imgs=JSON.stringify(c.imgs); sh.dataset.fulls=JSON.stringify(c.fulls||[]);
  document.getElementById("libscrim").classList.add("show"); sh.classList.add("show");
  dlgOpen(sh, opener);
}
function closeCard(){
  var sh = document.getElementById("libsheet");
  if(!sh.classList.contains("show")) return;
  document.getElementById("libscrim").classList.remove("show"); sh.classList.remove("show");
  dlgRestore();
}
function copyLibCap(){ var t=document.getElementById("libsheet").dataset.cap||""; if(navigator.clipboard){ navigator.clipboard.writeText(t).then(function(){ltoast("Caption copied ✓");}, function(){ltoast("Copy failed");}); } else { ltoast("Copy not supported"); } }
function saveLibImgs(btn){
  var strip = document.getElementById("libsheet-body").querySelectorAll(".lstrip img");
  var files = [], missed = 0, i, f;
  for(i=0;i<strip.length;i++){
    f = _dataUrlToFile(strip[i].dataset.packed || strip[i].src, "zyia-" + (i+1));
    if(f) files.push(f); else missed++;
  }
  if(!files.length && !strip.length){ ltoast("No photo on this card"); return; }
  /* NEVER LET A SHORT SET LOOK DELIBERATE — her standing rule, applied to the share sheet. */
  if(missed) ltoast(missed + " photo" + (missed === 1 ? "" : "s") + " couldn\u2019t be saved. Your caption and progress are safe. Try Save photos again.");
  _shareFiles(files, btn && btn.tagName ? btn : null);
}
/* REMOVE FROM APP (Jessica, 2026-10-07): "I should be able to post and then clear them from the
   app, and then the list will come down." The card leaves her screen at once (localStorage) and
   the removal rides the tap collector as libx_<rid>; the 6 AM job (apply_day_send
   --apply-removals) drops it from the shelf, so the file shrinks on the next publish. Undo sends
   checked:0, and the morning step honours only a card's LATEST record. */
var LR_KEY="libRemoved";
function loadLR(){ try{return JSON.parse(localStorage.getItem(LR_KEY))||{}}catch(e){return {}} }
function saveLR(d){ try{localStorage.setItem(LR_KEY, JSON.stringify(d))}catch(e){} }
function removeLibCard(){
  var sh=document.getElementById("libsheet"), rid=sh.dataset.rid; if(!rid) return;
  var d=loadLR(); d[rid]=Date.now(); saveLR(d);
  queueWorker("libx_"+rid, true, "removed", "");
  closeCard(); renderCards();
  ltoastUndo("Removed from your Party Library", function(){
    var d2=loadLR(); delete d2[rid]; saveLR(d2);
    queueWorker("libx_"+rid, false, "", "");
    renderCards(); ltoast("Back in your Party Library");
  });
}
function ltoastUndo(m, fn){
  var t=document.getElementById("ltoast");
  t.innerHTML=lesc(m)+'<button type="button" class="lundo">Undo</button>';
  t.querySelector(".lundo").onclick=function(){ t.classList.remove("show"); fn(); };
  t.classList.add("show"); clearTimeout(_ltt); _ltt=setTimeout(function(){t.classList.remove("show");}, 6000);
}
var _ltt; function ltoast(m){ var t=document.getElementById("ltoast"); t.textContent=m; t.classList.add("show"); clearTimeout(_ltt); _ltt=setTimeout(function(){t.classList.remove("show");}, Math.max(1600, m.length * 45)); }
document.addEventListener("click", function(e){
  var t=e.target;
  if(t && t.classList && t.classList.contains("gfxi")){ e.preventDefault(); openLb(t.dataset.full||t.src, t); }
});
/* a card photo is a real control: Enter or Space opens it, like a tap */
document.addEventListener("keydown", function(e){
  var t=e.target;
  if(t && t.classList && t.classList.contains("gfxi") && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openLb(t.dataset.full||t.src, t); }
});

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
</script>
