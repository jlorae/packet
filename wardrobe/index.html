<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wardrobe Photo Log</title>
<style>
  :root{--coral:#FF6A45;--sea:#12B9A6;--sun:#FFC531;--ink:#2B4F48;--sand:#FDF6EE;--faint:#a99a89}
  *{box-sizing:border-box}
  body{margin:0;background:var(--sand);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;
       -webkit-tap-highlight-color:transparent}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 60px}
  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 4px}
  .hdr h1{font-size:19px;font-weight:700;margin:0}
  .stat{font-size:12px;color:var(--faint);font-weight:600}
  .per{font:700 11px/1.4 system-ui;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);
       margin:16px 2px 6px}
  .row{background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;
       box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .row.done{opacity:.55}
  .chk{display:flex;align-items:flex-start;gap:10px;min-height:44px;cursor:pointer}
  .chk input{width:22px;height:22px;flex:0 0 22px;margin-top:2px;accent-color:var(--sea)}
  .nm{font-weight:600;font-size:14.5px}
  .meta{font-size:12px;color:var(--faint);margin:2px 0 0 32px}
  .note{display:block;width:calc(100% - 32px);margin:6px 0 0 32px;font:13px system-ui;
        padding:7px 9px;border:1px solid #e7dccb;border-radius:8px;background:#fffdf9;color:var(--ink)}
  .note::placeholder{color:#c9bda9}
  .donehead{font:700 13px system-ui;color:var(--sea);text-align:center;padding:12px 0;
            cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}
  #gate{position:fixed;inset:0;z-index:9999;background:var(--sand);display:flex;
       align-items:center;justify-content:center;flex-direction:column;gap:12px}
  #gate input{font:16px system-ui;padding:10px 14px;border:1px solid #d8cec2;border-radius:10px;
       width:min(320px,80vw)}
  #gate button{font:600 15px system-ui;padding:10px 22px;border:0;border-radius:10px;
       background:var(--coral);color:#fff;cursor:pointer}
  #gerr{font:13px system-ui;color:#b3563f;min-height:18px}
  #badge{position:fixed;bottom:10px;right:10px;background:#b3563f;color:#fff;font:700 12px system-ui;
       padding:6px 12px;border-radius:20px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #built{position:fixed;bottom:10px;left:10px;font:600 11px system-ui;color:var(--ink);opacity:.5}
</style></head>

var PAYLOAD=null, doneOpen=false;

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

async function sha256hex(s){
  var b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("");
}
async function decrypt(pass){
  var raw=Uint8Array.from(atob(__BLOB__), function(c){return c.charCodeAt(0)});
  var salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
  var km=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:__ITERS__,hash:"SHA-256"},
           km, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv}, key, data);
  return new TextDecoder().decode(pt);
}

function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
  +"-"+String(d.getDate()).padStart(2,"0"); }

function rowHtml(it){
  var done = !!it.photographed;
  return '<div class="row'+(done?' done':'')+'" data-key="'+esc(it.key)+'">'
    +'<label class="chk"><input type="checkbox" '+(done?'checked':'')+' onchange="toggle(this,\''+esc(it.key).replace(/'/g,"\\'")+'\')">'
    +'<span><span class="nm">'+esc(it.name)+' ('+esc(it.size)+')</span>'
    +'<div class="meta">'+esc(it.date||'undated')+(it.price?' &middot; $'+esc(it.price):'')+'</div></span></label>'
    +'<input class="note" placeholder="note (e.g. this one\'s for someone else)" value="'+esc(it.note||'')
    +'" data-key="'+esc(it.key)+'" onblur="saveNote(this)" onkeydown="if(event.key===\'Enter\')this.blur()">'
    +'</div>';
}

function render(){
  var items = PAYLOAD.items;
  var todo = items.filter(function(i){return !i.photographed});
  var done = items.filter(function(i){return i.photographed});
  document.getElementById("stat").textContent = done.length+" of "+items.length+" photographed";
  var html = todo.map(rowHtml).join("");
  html += '<div class="donehead" onclick="doneOpen=!doneOpen;render()">'
        + (doneOpen ? "&and; hide" : "&or; show") + " " + done.length
        + " already photographed</div>";
  if(doneOpen) html += done.map(rowHtml).join("");
  document.getElementById("list").innerHTML = html || '<div style="text-align:center;color:var(--faint);padding:30px 0">Nothing to shoot &mdash; you\'re caught up.</div>';
}

function itemByKey(k){ return PAYLOAD.items.find(function(i){return i.key===k}); }

function toggle(cb, key){
  var it = itemByKey(key);
  it.photographed = cb.checked ? todayStr() : "";
  queueEdit(key+":check", {key:key, photographed: cb.checked});
  render();
}
function saveNote(input){
  var key = input.getAttribute("data-key"), it = itemByKey(key);
  var val = input.value.trim();
  if((it.note||"") === val) return;
  it.note = val;
  queueEdit(key+":note", {key:key, note: val});
}

function queueEdit(iid, data){
  var q = JSON.parse(localStorage.getItem("wardQueue")||"[]").filter(function(e){return e.iid!==iid});
  q.push({iid:iid, data:data, t:Date.now()});
  localStorage.setItem("wardQueue", JSON.stringify(q));
  flushQueue();
}
async function flushQueue(){
  var q = JSON.parse(localStorage.getItem("wardQueue")||"[]");
  var b = document.getElementById("badge");
  if(!q.length){ b.style.display="none"; return; }
  if(!__WORKER__){ b.style.display="block"; b.textContent=q.length+" not saved (no connection set up)"; return; }
  var pass = localStorage.getItem("pp");
  var token = await sha256hex(pass||"");
  var remaining = [];
  for(var i=0;i<q.length;i++){
    var e = q[i];
    try{
      var res = await fetch(__WORKER__+"/edit", {method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({kind:"wardrobe", data:e.data, token:token})});
      var body = await res.json();
      if(!(body && body.r === "ok")) remaining.push(e);
    }catch(err){ remaining.push(e); }
  }
  localStorage.setItem("wardQueue", JSON.stringify(remaining));
  if(remaining.length){ b.style.display="block"; b.textContent=remaining.length+" not saved &middot; tap to retry"; b.innerHTML=remaining.length+" not saved &middot; tap to retry"; }
  else b.style.display="none";
}

async function unlock(fromSaved){
  var el=document.getElementById("gp"), err=document.getElementById("gerr");
  var pass = fromSaved ? (localStorage.getItem("pp")||"") : (el?el.value.trim():"");
  if(!pass){ if(!fromSaved && err) err.textContent="Type your passphrase."; return; }
  if(err) err.textContent="Unlocking...";
  try{
    var json = await decrypt(pass);
    PAYLOAD = JSON.parse(json);
    localStorage.setItem("pp", pass);
    var g=document.getElementById("gate"); if(g) g.style.display="none";
    document.getElementById("built").textContent = "list from " + __BUILT__;
    render();
    flushQueue();
  }catch(e){
    if(fromSaved){ var g2=document.getElementById("gate"); if(g2) g2.style.display="flex"; }
    else if(err) err.textContent="That didn't unlock it \u2014 check the passphrase.";
  }
}
document.addEventListener("DOMContentLoaded", function(){
  var p=document.getElementById("gp");
  if(p) p.addEventListener("keydown", function(e){ if(e.key==="Enter") unlock(false); });
  if(localStorage.getItem("pp")){ document.getElementById("gate").style.display="none"; unlock(true); }
});
window.addEventListener("online", flushQueue);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) flushQueue(); });
setInterval(flushQueue, 20000);
</script>
